services:
  backendsktarjetaclub:
    image: backendsktarjetaclub:latest
    build:
      context: .
      args:
        - PORT=${PORT}
    container_name: backendsktarjetaclub
    ports:
      - "127.0.0.1:${PORT}:${PORT}"
    env_file:
      - .env
    environment:
      - PORT=${PORT}
    restart: always
    user: "node"
    volumes:
      - ./serviceAccountKey.json:/app/serviceAccountKey.json:ro
    networks:
      - local_net

networks:
  local_net:
    driver: bridge